<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人工作台 | HomeTab</title>
    <style>
        :root {
            --bg-glass: rgba(40, 40, 40, 0.8);
            --btn-color: #4a4a4a;
            --accent-blue: #007bff;
            --accent-green: #28a745;
            --accent-purple: #6f42c1;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 20px;
            background-image: url('https://shoplineimg.com/media/6659a4dd92aca30019a64bb3/original.webp?source_format=png');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: white;
        }

        /* 頂部選單容器 */
        .header-nav {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        /* 漢堡下拉選單主體 */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background-color: var(--bg-glass);
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            min-width: 140px;
        }

        .dropbtn:hover {
            background-color: rgba(100, 100, 100, 0.9);
            border-color: white;
        }

        /* 下拉內容 (隱藏) */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            border-radius: 12px;
            z-index: 10;
            margin-top: 8px;
            overflow: hidden;
        }

        /* 下拉選單內的連結 */
        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            transition: 0.2s;
            font-size: 15px;
        }

        .dropdown-content a:hover {
            background-color: #eee;
            padding-left: 20px;
        }

        /* 顯示下拉內容 */
        .show { display: block; }

        /* 行事曆區塊 */
        .calendar-container {
            background: var(--bg-glass);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        iframe {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            border: none;
            background: white;
            opacity: 0.9;
        }

        h1 {
            margin-top: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <div class="dropdown">
            <button onclick="toggleDrop('toolDrop')" class="dropbtn">🛠️ 常用工具</button>
            <div id="toolDrop" class="dropdown-content">
                <a href="https://www.google.com/?safe=active&ssui=on" target="_blank">Google 搜尋</a>
                <a href="https://mail.google.com/mail/u/0/" target="_blank">Gmail</a>
                <a href="https://drive.google.com/drive/home" target="_blank">雲端硬碟</a>
                <a href="https://chatgpt.com/" target="_blank">ChatGPT</a>
                <a href="https://gemini.google.com/" target="_blank">Gemini</a>
            </div>
        </div>

        <div class="dropdown">
            <button onclick="toggleDrop('schoolDrop')" class="dropbtn">🏫 學習/學校</button>
            <div id="schoolDrop" class="dropdown-content">
                <a href="https://docs.google.com/spreadsheets/d/13dxNULJ4kTqaSN46Z8IgAbG2l3utWMVDxhEjNFEHdJg/edit" target="_blank">聯絡簿</a>
                <a href="https://www.fhjh.tn.edu.tw/" target="_blank">學校官網</a>
                <a href="https://mest.meikoschool.com.tw/" target="_blank">MEST 系統</a>
            </div>
        </div>

        <div class="dropdown">
            <button onclick="toggleDrop('funDrop')" class="dropbtn">🎮 娛樂/社群</button>
            <div id="funDrop" class="dropdown-content">
                <a href="https://www.youtube.com/" target="_blank">YouTube</a>
                <a href="https://www.instagram.com/" target="_blank">Instagram</a>
                <a href="https://www.crazygames.com/" target="_blank">CrazyGames</a>
                <a href="https://www.geo-fs.com/" target="_blank">Geo-FS</a>
            </div>
        </div>
    </div>

    <div class="calendar-container">
        <h1>📅 我的行事曆</h1>
        <div class="calendar-grid">
            <iframe src="https://calendar.google.com/calendar/embed?src=c_a6c9f987bddfab6ae56e125c44395fa3ddfd11ca11844a00788df7269f740389%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
            <iframe src="https://calendar.google.com/calendar/embed?src=m7k83ecsm3pqukojfjt8gjt6u0%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
            <iframe src="https://calendar.google.com/calendar/embed?src=3q9aujb2lch5d6ggkehe97a7do%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
            <iframe src="https://calendar.google.com/calendar/embed?src=jerry3361999%40gmail.com&ctz=Asia%2FTaipei"></iframe>
        </div>
    </div>

    <script>
        /* 切換下拉選單顯示 */
        function toggleDrop(id) {
            // 先關閉其他的
            const drops = document.getElementsByClassName("dropdown-content");
            for (let i = 0; i < drops.length; i++) {
                if (drops[i].id !== id) {
                    drops[i].classList.remove('show');
                }
            }
            // 切換目前的
            document.getElementById(id).classList.toggle("show");
        }

        /* 點選選單外區域自動關閉 */
        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                const sharedDropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < sharedDropdowns.length; i++) {
                    const openDropdown = sharedDropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
