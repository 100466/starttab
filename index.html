<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主控台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-glass: rgba(15, 15, 15, 0.75);
            --accent-blue: #00d2ff;
            --gemini-blue: #4facfe; /* 更亮一點的藍色 */
            --white: #ffffff;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 20px;
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80');
            background-repeat: no-repeat; background-size: cover; background-attachment: fixed; background-position: center;
            color: var(--white); transition: background-image 0.5s ease; text-align: center;
        }

        /* 頂部時間區 */
        .clock-container { margin: 30px 0; text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); }
        #digital-clock { font-size: 72px; font-weight: 200; margin: 0; letter-spacing: 3px; }
        #date-display { font-size: 20px; opacity: 0.8; margin-top: 5px; }

        /* 搜尋列區域 */
        .search-container { max-width: 650px; margin: 0 auto 30px; display: flex; align-items: center; gap: 12px; }
        
        /* 搜尋列左側 Gemini 按鈕樣式強化 */
        .gemini-btn {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; transition: 0.3s; flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .gemini-btn i { 
            color: var(--gemini-blue) !important; /* 強制藍色 */
            font-size: 22px; 
            display: block !important; /* 強制顯示 */
            text-shadow: 0 0 10px rgba(79, 172, 254, 0.8);
        }
        .gemini-btn:hover { 
            background: rgba(79, 172, 254, 0.3); 
            transform: scale(1.1); 
            border-color: var(--gemini-blue);
        }

        .search-box { position: relative; flex-grow: 1; display: flex; align-items: center; }
        .search-box input {
            width: 100%; padding: 14px 20px 14px 50px; border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px); color: white; font-size: 16px; outline: none; transition: 0.3s;
        }
        .search-box input:focus { background: rgba(255,255,255,0.35); box-shadow: 0 0 15px var(--accent-blue); }
        .search-box i { position: absolute; left: 20px; color: var(--accent-blue); font-size: 18px; }

        /* 選單導航 */
        .header-nav { display: flex; gap: 12px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .dropdown { position: relative; }
        .dropbtn {
            background-color: var(--bg-glass); color: white; padding: 12px 22px;
            font-size: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50px;
            cursor: pointer; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .dropbtn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }

        .dropdown-content {
            display: none; position: absolute; background: white; min-width: 200px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); border-radius: 15px; z-index: 100; margin-top: 10px;
            overflow: hidden; text-align: left;
        }
        .dropdown-content a {
            color: #333; padding: 12px 18px; text-decoration: none; display: flex;
            align-items: center; gap: 10px; font-size: 14px; transition: 0.2s;
        }
        .dropdown-content a:hover { background: #f0f7ff; padding-left: 22px; }
        .show { display: block; animation: fadeIn 0.2s; }

        /* 卡片佈局 */
        .content-card {
            background: var(--bg-glass); padding: 25px; border-radius: 20px;
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); margin: 0 auto 25px;
            max-width: 1100px;
        }
        h3 { margin-top: 0; display: flex; align-items: center; gap: 10px; color: var(--accent-blue); justify-content: center; }

        /* 課表表格 */
        .schedule-table {
            width: 100%; border-collapse: collapse; margin-top: 15px;
            background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden;
        }
        .schedule-table th, .schedule-table td { padding: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .schedule-table th { background: rgba(0, 210, 255, 0.4); font-weight: 600; }
        .time-label { background: rgba(255,255,255,0.1); font-weight: bold; width: 50px; }

        /* 行事曆 4 格配置 */
        .calendar-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); 
            gap: 20px; margin-top: 15px;
        }
        iframe { width: 100%; height: 400px; border-radius: 15px; border: none; background: white; opacity: 0.95; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="clock-container">
        <div id="digital-clock">00:00:00</div>
        <div id="date-display">正在獲取日期...</div>
    </div>

    <div class="search-container">
        <a href="https://gemini.google.com/" target="_blank" class="gemini-btn" title="前往 Gemini">
            <i class="fas fa-wand-magic-sparkles"></i>
        </a>
        <form action="https://www.google.com/search" method="GET" target="_blank" style="flex-grow: 1;">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" name="q" placeholder="在此輸入搜尋內容..." autocomplete="off">
            </div>
        </form>
    </div>

    <div class="header-nav">
        <button onclick="changeBg()" class="dropbtn"><i class="fas fa-palette"></i> 換背景</button>

        <div class="dropdown">
            <button onclick="toggleDrop('schoolDrop')" class="dropbtn"><i class="fas fa-graduation-cap"></i> 學校系統</button>
            <div id="schoolDrop" class="dropdown-content">
                <a href="https://classroom.google.com/" target="_blank"><i class="fas fa-chalkboard" style="color: #1a73e8;"></i> Google Classroom</a>
                <a href="https://drive.google.com/" target="_blank"><i class="fab fa-google-drive" style="color: #34A853;"></i> 我的雲端硬碟</a>
                <a href="http://office.fhjh.tn.edu.tw:8080/114b_86/query_main.php" target="_blank"><i class="fas fa-table"></i> 117 課表查詢</a>
                <a href="https://docs.google.com/spreadsheets/d/13dxNULJ4kTqaSN46Z8IgAbG2l3utWMVDxhEjNFEHdJg/edit" target="_blank"><i class="fas fa-file-excel" style="color: #1D6F42;"></i> 數位聯絡簿</a>
                <a href="https://www.fhjh.tn.edu.tw/" target="_blank"><i class="fas fa-school"></i> 學校官網</a>
            </div>
        </div>

        <div class="dropdown">
            <button onclick="toggleDrop('socialDrop')" class="dropbtn"><i class="fas fa-users"></i> 社群媒體</button>
            <div id="socialDrop" class="dropdown-content">
                <a href="https://www.youtube.com/" target="_blank"><i class="fab fa-youtube" style="color: #FF0000;"></i> YouTube</a>
                <a href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram" style="color: #E1306C;"></i> Instagram</a>
                <a href="https://band.us/" target="_blank"><i class="fas fa-th-large" style="color: #22C34E;"></i> BAND</a>
            </div>
        </div>

        <div class="dropdown">
            <button onclick="toggleDrop('toolDrop')" class="dropbtn"><i class="fas fa-brain"></i> AI 與工具</button>
            <div id="toolDrop" class="dropdown-content">
                <a href="https://gemini.google.com/" target="_blank"><i class="fas fa-wand-magic-sparkles" style="color: #4285F4;"></i> Gemini</a>
                <a href="https://chatgpt.com/" target="_blank"><i class="fas fa-robot" style="color: #10a37f;"></i> ChatGPT</a>
                <a href="https://translate.google.com/" target="_blank"><i class="fas fa-language"></i> 翻譯</a>
                <a href="https://pomofocus.io/" target="_blank"><i class="fas fa-clock"></i> 蕃茄鐘</a>
            </div>
        </div>
    </div>

    <div class="content-card">
        <h3><i class="fas fa-table-list"></i> 117 班級課表</h3>
        <table class="schedule-table">
            <thead>
                <tr><th class="time-label">節</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr>
            </thead>
            <tbody>                
                <tr><td class="time-label">0</td><td>自主</td><td>晨讀</td><td>升旗</td><td>英廣</td><td>晨讀</td></tr>
                <tr><td class="time-label">1</td><td>童軍</td><td>公民</td><td>班輔</td><td>生科</td><td>體育</td></tr>
                <tr><td class="time-label">2</td><td>體育</td><td>本土</td><td>週會</td><td>資科</td><td>歷史</td></tr>
                <tr><td class="time-label">3</td><td>音樂</td><td>英會</td><td>表藝</td><td>生物</td><td>國文</td></tr>
                <tr><td class="time-label">4</td><td>國文</td><td>健教</td><td>國文</td><td>家政</td><td>英文</td></tr>
                <tr><td colspan="6" style="padding:5px; font-size:12px; background:rgba(255,255,255,0.05)">午休時間</td></tr>
                <tr><td class="time-label">5</td><td>英語</td><td>英語</td><td>輔導</td><td>視藝</td><td>文藝</td></tr>
                <tr><td class="time-label">6</td><td>生物</td><td>國文</td><td>數學</td><td>國文</td><td>數學</td></tr>
                <tr><td class="time-label">7</td><td>社團</td><td>數學</td><td>地理</td><td>數學</td><td>生物</td></tr>
                <tr><td class="time-label">8</td><td>社團</td><td>國文</td><td>數學</td><td>英文</td><td>導輔</td></tr>
            </tbody>
        </table>
    </div>

    <div class="content-card">
        <h3><i class="far fa-calendar-alt"></i> 班級與個人行事曆</h3>
        <div class="calendar-grid">
            <iframe src="https://calendar.google.com/calendar/embed?src=c_a6c9f987bddfab6ae56e125c44395fa3ddfd11ca11844a00788df7269f740389%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
            <iframe src="https://calendar.google.com/calendar/embed?src=jerry3361999%40gmail.com&ctz=Asia%2FTaipei"></iframe>
            <iframe src="https://calendar.google.com/calendar/embed?mode=AGENDA&src=c_a6c9f987bddfab6ae56e125c44395fa3ddfd11ca11844a00788df7269f740389%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
            <iframe src="https://calendar.google.com/calendar/embed?src=3q9aujb2lch5d6ggkehe97a7do%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digital-clock').textContent = `${h}:${m}:${s}`;
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('zh-TW', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        let bgIndex = 0;
        const bgs = [
            'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80',
            'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80',
            'https://shoplineimg.com/media/6659a4dd92aca30019a64bb3/original.webp?source_format=png'
        ];
        function changeBg() {
            bgIndex = (bgIndex + 1) % bgs.length;
            document.body.style.backgroundImage = `url('${bgs[bgIndex]}')`;
        }

        function toggleDrop(id) {
            const currentDrop = document.getElementById(id);
            const isShowing = currentDrop.classList.contains('show');
            document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
            if (!isShowing) currentDrop.classList.add('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
            }
        }
    </script>
</body>
</html>
