<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨平台智慧完全體主控台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-glass: rgba(15, 15, 15, 0.75);
            --accent-blue: #00d2ff;
            --white: #ffffff;
            --keep-yellow: #FBBC04;
            --calendar-green: #34A853;
            --doc-blue: #2b579a;
            --sheet-green: #107c41;
            --fb-blue: #1877F2;
            --messenger-color: #00B2FF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 20px;
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80');
            background-repeat: no-repeat; background-size: cover; background-attachment: fixed; background-position: center;
            color: var(--white); text-align: center;
            transition: background-image 0.5s ease-in-out;
        }

        /* 換背景按鈕 */
        #bg-change-btn {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; border-radius: 50%; width: 45px; height: 45px;
            cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; z-index: 1000;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        #bg-change-btn:hover { background: rgba(0, 210, 255, 0.4); border-color: var(--accent-blue); transform: scale(1.1); }

        .clock-container { margin: 30px 0; }
        #digital-clock { font-size: 72px; font-weight: 200; margin: 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); }
        #date-display { font-size: 20px; opacity: 0.8; margin-top: 5px; }

        /* 萬能智慧搜尋框 */
        .search-container { max-width: 650px; margin: 0 auto 30px; position: relative; display: flex; align-items: center; }
        .search-wrapper {
            position: relative; width: 100%; display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50px;
            padding: 5px 10px 5px 20px; transition: 0.3s;
        }
        .search-wrapper:focus-within { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        .search-wrapper input { flex-grow: 1; background: none; border: none; color: white; font-size: 16px; outline: none; padding: 10px 0; }
        .search-wrapper input::placeholder { color: rgba(255,255,255,0.6); }
        
        .gemini-inline-btn {
            background: linear-gradient(135deg, #4285F4, #34A853); border: none; border-radius: 50%;
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; transition: 0.3s; margin-left: 10px;
        }
        .gemini-inline-btn i { color: white !important; font-size: 18px; }

        /* 導覽選單 */
        .header-nav { display: flex; gap: 12px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .dropdown { position: relative; }
        
        .dropbtn {
            background-color: var(--bg-glass); color: white; padding: 12px 22px;
            font-size: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50px;
            cursor: pointer; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .dropbtn:hover { border-color: var(--accent-blue); background-color: rgba(0, 210, 255, 0.2); }
        
        .dropdown-content {
            display: none; position: absolute; background: white; min-width: 250px;
            max-height: 400px; overflow-y: auto; -webkit-overflow-scrolling: touch;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); border-radius: 15px; z-index: 1000; margin-top: 10px;
            overflow-x: hidden; text-align: left;
        }
        
        .dropdown-content::-webkit-scrollbar { width: 6px; }
        .dropdown-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }

        .dropdown-content button, .dropdown-content a {
            background: none; border: none; width: 100%; box-sizing: border-box;
            color: #333; padding: 12px 18px; text-decoration: none; display: flex;
            align-items: center; gap: 10px; font-size: 14px; transition: 0.2s; cursor: pointer;
            text-align: left; font-family: inherit;
        }
        .dropdown-content button:hover, .dropdown-content a:hover { background: #f0f7ff; padding-left: 22px; }
        .show { display: block; animation: fadeIn 0.2s; }

        .mest-icon-circle {
            background-color: white; color: #007bff; border: 1px solid #007bff;
            border-radius: 50%; width: 18px; height: 18px; display: inline-flex; 
            align-items: center; justify-content: center; font-size: 10px;
        }

        /* 儀表板雙欄並排佈局 */
        .dashboard-grid {
            display: flex; gap: 20px; max-width: 1450px; margin: 0 auto 25px; flex-wrap: wrap;
        }

        .content-card {
            background: var(--bg-glass); padding: 25px; border-radius: 20px;
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            flex: 1; min-width: 450px; box-sizing: border-box; position: relative; z-index: 1;
        }
        
        @media (max-width: 992px) {
            .content-card { min-width: 100%; }
        }

        h3 { margin-top: 0; display: flex; align-items: center; gap: 10px; color: var(--accent-blue); justify-content: center; }

        /* 課表樣式 */
        .schedule-table {
            width: 100%; border-collapse: collapse; margin-top: 15px;
            background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden;
        }
        .schedule-table th, .schedule-table td { padding: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .schedule-table th { background: rgba(0, 210, 255, 0.4); }
        .time-label { background: rgba(255,255,255,0.1); font-weight: bold; width: 45px; }

        /* 午休分隔線樣式 */
        .lunch-break td {
            background: rgba(0, 210, 255, 0.15);
            font-size: 14px; letter-spacing: 3px;
            color: var(--accent-blue); font-weight: bold;
        }

        /* 多重日曆分頁切換樣式 */
        .calendar-tabs {
            display: flex; justify-content: center; gap: 8px; margin-top: 15px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .calendar-tab-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 16px; border-radius: 30px; cursor: pointer;
            font-size: 13px; transition: 0.3s;
        }
        .calendar-tab-btn:hover { background: rgba(0, 210, 255, 0.2); border-color: var(--accent-blue); }
        .calendar-tab-btn.active { background: var(--calendar-green); border-color: var(--calendar-green); box-shadow: 0 0 10px rgba(52, 168, 83, 0.4); }

        .calendar-wrapper {
            width: 100%; height: 450px; border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); background: white; display: none;
        }
        .calendar-wrapper.active { display: block; animation: fadeIn 0.3s; }
        .calendar-wrapper iframe { width: 100%; height: 100%; border: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <button id="bg-change-btn" onclick="changeBackground()" title="更換背景圖片">
        <i class="fas fa-image"></i>
    </button>

    <div class="clock-container">
        <div id="digital-clock">00:00:00</div>
        <div id="date-display">正在獲取日期...</div>
    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <i class="fas fa-search" style="color: var(--accent-blue); margin-right: 15px;"></i>
            <input type="text" id="smart-search" placeholder="輸入關鍵字搜尋，或直接輸入網址跳轉..." autocomplete="off" onkeydown="handleSearch(event)">
            <button type="button" onclick="smartRedirect('https://gemini.google.com/', 'googlechrome://gemini.google.com/')" class="gemini-inline-btn" title="啟動 Gemini">
                <i class="fas fa-wand-magic-sparkles"></i>
            </button>
        </div>
    </div>

    <div class="header-nav">
        
        <div class="dropdown">
            <button onclick="toggleDrop('schoolOnlyDrop')" class="dropbtn"><i class="fas fa-graduation-cap"></i> 學校專區</button>
            <div id="schoolOnlyDrop" class="dropdown-content">
                <a href="https://www.fhjh.tn.edu.tw" target="_blank"><i class="fas fa-school" style="color: #ff6b6b;"></i> 學校首頁</a>
                <a href="https://mest.meikoschool.com.tw/" target="_blank"><span class="mest-icon-circle"><i class="fas fa-exclamation"></i></span> Mest 數位學習</a>
                <button onclick="smartRedirect('https://classroom.google.com/', 'googleclassroom://')"><i class="fas fa-chalkboard" style="color: #1a73e8;"></i> Google Classroom</button>
                <button onclick="smartRedirect('https://docs.google.com/spreadsheets/d/13dxNULJ4kTqaSN46Z8IgAbG2l3utWMVDxhEjNFEHdJg/edit', 'googlesheets://docs.google.com/spreadsheets/d/13dxNULJ4kTqaSN46Z8IgAbG2l3utWMVDxhEjNFEHdJg/edit')"><i class="fas fa-file-excel" style="color: #1D6F42;"></i> 數位聯絡簿</button>
            </div>
        </div>

        <div class="dropdown">
            <button onclick="toggleDrop('cloudDrop')" class="dropbtn"><i class="fas fa-cloud"></i> 雲端工具</button>
            <div id="cloudDrop" class="dropdown-content">
                <button onclick="smartRedirect('https://keep.google.com/', 'googlekeep://')"><i class="fas fa-lightbulb" style="color: var(--keep-yellow);"></i> Google Keep 筆記/待辦</button>
                <button onclick="smartRedirect('https://calendar.google.com/', 'calshow://')"><i class="far fa-calendar-alt" style="color: var(--calendar-green);"></i> 智慧行事曆</button>
                <button onclick="smartRedirect('https://mail.google.com/', 'googlegmail://')"><i class="fas fa-envelope" style="color: #EA4335;"></i> Gmail 信箱</button>
                <button onclick="smartRedirect('https://docs.google.com/', 'googledocs://')"><i class="fas fa-file-lines" style="color: var(--doc-blue);"></i> Google 文件</button>
                <button onclick="smartRedirect('https://docs.google.com/spreadsheets/', 'googlesheets://')"><i class="fas fa-table" style="color: var(--sheet-green);"></i> Google 試算表</button>
            </div>
        </div>

        <div class="dropdown">
            <button onclick="toggleDrop('toolDrop')" class="dropbtn"><i class="fas fa-code"></i> 寫程式/AI</button>
            <div id="toolDrop" class="dropdown-content">
                <a href="https://gemini.google.com/" target="_blank"><i class="fas fa-wand-magic-sparkles" style="color: #4285F4;"></i> Gemini</a>
                <a href="https://chatgpt.com/" target="_blank"><i class="fas fa-robot" style="color: #10a37f;"></i> ChatGPT</a>
                <a href="https://github.com/" target="_blank"><i class="fab fa-github" style="color: #333;"></i> GitHub</a>
                <a href="https://colab.research.google.com/" target="_blank"><i class="fas fa-laptop-code" style="color: #F9AB00;"></i> Google Colab</a>
                <a href="https://codecombat.com/" target="_blank"><i class="fas fa-dragon" style="color: #20b2aa;"></i> CodeCombat</a>
            </div>
        </div>

        <div class="dropdown">
            <button onclick="toggleDrop('gameDrop')" class="dropbtn"><i class="fas fa-gamepad"></i> 休閒娛樂</button>
            <div id="gameDrop" class="dropdown-content">
                <button onclick="smartRedirect('https://www.youtube.com/', 'youtube://')"><i class="fab fa-youtube" style="color: #FF0000;"></i> YouTube App</button>
                <a href="https://store.steampowered.com/" target="_blank"><i class="fab fa-steam" style="color: #171a21;"></i> Steam 商店</a>
                <a href="https://www.crazygames.com/" target="_blank"><i class="fas fa-gamepad" style="color: #FF6600;"></i> CrazyGames</a>
                <a href="https://www.i-gamer.net/" target="_blank"><i class="fas fa-play-circle" style="color: #00A1D6;"></i> 遊戲天堂</a>
                <a href="https://scratch.mit.edu/" target="_blank"><i class="fas fa-cat" style="color: #F7A226;"></i> Scratch</a>
                <a href="https://www.chunkbase.com/apps/slime-finder#seed=-5535997839764821991&platform=java&x=0&z=0&zoom=1" target="_blank"><i class="fas fa-map" style="color: #55FF55;"></i> Chunkbase</a>
                <a href="https://poki.com/zh" target="_blank"><i class="fas fa-smile" style="color: #FFC107;"></i> Poki</a>
            </div>
        </div>

        <div class="dropdown">
            <button onclick="toggleDrop('socialDrop')" class="dropbtn"><i class="fas fa-users"></i> 社群媒體</button>
            <div id="socialDrop" class="dropdown-content">
                <button onclick="smartRedirect('https://www.instagram.com/', 'instagram://')"><i class="fab fa-instagram" style="color: #E1306C;"></i> Instagram</button>
                <button onclick="smartRedirect('https://www.facebook.com/', 'fb://')"><i class="fab fa-facebook" style="color: var(--fb-blue);"></i> Facebook</button>
                <button onclick="smartRedirect('https://www.messenger.com/', 'fb-messenger://')"><i class="fab fa-facebook-messenger" style="color: var(--messenger-color);"></i> Messenger</button>
            </div>
        </div>

    </div>

    <div class="dashboard-grid">
        
        <div class="content-card">
            <h3><i class="fas fa-table-list"></i> 班級課表</h3>
            <table class="schedule-table">
                <thead>
                    <tr><th class="time-label">節</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr>
                </thead>
                <tbody>
                    <tr><td class="time-label">1</td><td>童軍</td><td>公民</td><td>班輔</td><td>生科</td><td>體育</td></tr>
                    <tr><td class="time-label">2</td><td>體育</td><td>本土</td><td>週會</td><td>資科</td><td>歷史</td></tr>
                    <tr><td class="time-label">3</td><td>音樂</td><td>英會</td><td>表藝</td><td>生物</td><td>國文</td></tr>
                    <tr><td class="time-label">4</td><td>國文</td><td>健教</td><td>國文</td><td>家政</td><td>英語</td></tr>
                    
                    <tr class="lunch-break"><td colspan="6">🍽️ 午餐與午休 (11:55 - 13:25) 💤</td></tr>
                    
                    <tr><td class="time-label">5</td><td>英語</td><td>英語</td><td>輔導</td><td>視藝</td><td>文翼</td></tr>
                    <tr><td class="time-label">6</td><td>生物</td><td>國文</td><td>數學</td><td>國文</td><td>數學</td></tr>
                    <tr><td class="time-label">7</td><td>社團</td><td>數學</td><td>地理</td><td>數學</td><td>生物</td></tr>
                    <tr><td class="time-label">8</td><td>社團</td><td>國輔</td><td>數輔</td><td>英輔</td><td>導輔</td></tr>
                </tbody>
            </table>
        </div>

        <div class="content-card">
            <h3><i class="far fa-calendar-alt" style="color: var(--calendar-green);"></i> 個人智慧日曆</h3>
            
            <div class="calendar-tabs">
                <button class="calendar-tab-btn active" onclick="switchCalendar(0)">行程日曆 A</button>
                <button class="calendar-tab-btn" onclick="switchCalendar(1)">個人日曆</button>
                <button class="calendar-tab-btn" onclick="switchCalendar(2)">行程日曆 B</button>
                <button class="calendar-tab-btn" onclick="switchCalendar(3)">行程日曆 C</button>
            </div>

            <div class="calendar-wrapper active">
                <iframe src="https://calendar.google.com/calendar/embed?src=c_a6c9f987bddfab6ae56e125c44395fa3ddfd11ca11844a00788df7269f740389%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
            </div>
            <div class="calendar-wrapper">
                <iframe src="https://calendar.google.com/calendar/embed?src=jerry3361999%40gmail.com&ctz=Asia%2FTaipei"></iframe>
            </div>
            <div class="calendar-wrapper">
                <iframe src="https://calendar.google.com/calendar/embed?src=m7k83ecsm3pqukojfjt8gjt6u0%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
            </div>
            <div class="calendar-wrapper">
                <iframe src="https://calendar.google.com/calendar/embed?src=3q9aujb2lch5d6ggkehe97a7do%40group.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
            </div>
        </div>

    </div>

    <script>
        // --- 初始化背景功能 ---
        window.onload = function() {
            const savedBg = localStorage.getItem('dashboardBg');
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
            }
        };

        function changeBackground() {
            const newUrl = prompt("請貼上新的背景圖片網址 (URL)：\n\n💡 提示：如果想恢復原本的預設背景，請直接留空並按下「確定」。");
            
            if (newUrl !== null) {
                if (newUrl.trim() === "") {
                    const defaultBg = "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80";
                    document.body.style.backgroundImage = `url('${defaultBg}')`;
                    localStorage.removeItem('dashboardBg'); // 清除記憶
                } else {
                    document.body.style.backgroundImage = `url('${newUrl}')`;
                    localStorage.setItem('dashboardBg', newUrl); // 記憶新背景
                }
            }
        }

        // --- 核心功能區 ---
        function switchCalendar(index) {
            const tabs = document.querySelectorAll('.calendar-tab-btn');
            const wrappers = document.querySelectorAll('.calendar-wrapper');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            wrappers.forEach(wrap => wrap.classList.remove('active'));
            
            tabs[index].classList.add('active');
            wrappers[index].classList.add('active');
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('smart-search').value.trim();
                if (!input) return;

                const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;

                if (urlPattern.test(input)) {
                    let targetUrl = input;
                    if (!/^https?:\/\//i.test(input)) {
                        targetUrl = 'http://' + input;
                    }
                    window.open(targetUrl, '_blank');
                } else {
                    window.open('https://www.google.com/search?q=' + encodeURIComponent(input), '_blank');
                }
            }
        }

        function smartRedirect(webUrl, iosUrl) {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAppleDevice = /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            
            if (isAppleDevice) {
                const start = Date.now();
                window.location.href = iosUrl;
                setTimeout(() => {
                    if (Date.now() - start < 2200) {
                        window.open(webUrl, '_blank');
                    }
                }, 2000);
            } else {
                window.open(webUrl, '_blank');
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('digital-clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            document.getElementById('date-display').textContent = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }
        setInterval(updateTime, 1000); updateTime();

        function toggleDrop(id) {
            const currentDrop = document.getElementById(id);
            const isShowing = currentDrop.classList.contains('show');
            document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
            if (!isShowing) currentDrop.classList.add('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
            }
        }
    </script>
</body>
</html>
