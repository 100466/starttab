<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 雲端智慧主控台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-glass: rgba(15, 15, 15, 0.75);
            --accent-blue: #00d2ff;
            --white: #ffffff;
            --keep-yellow: #FBBC04;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 20px;
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80');
            background-repeat: no-repeat; background-size: cover; background-attachment: fixed; background-position: center;
            color: var(--white); text-align: center;
        }

        .clock-container { margin: 30px 0; }
        #digital-clock { font-size: 72px; font-weight: 200; margin: 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); }
        #date-display { font-size: 20px; opacity: 0.8; margin-top: 5px; }

        /* 萬能智慧搜尋框 */
        .search-container { max-width: 650px; margin: 0 auto 30px; position: relative; display: flex; align-items: center; }
        .search-wrapper {
            position: relative; width: 100%; display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50px;
            padding: 5px 10px 5px 20px; transition: 0.3s;
        }
        .search-wrapper:focus-within { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        .search-wrapper input { flex-grow: 1; background: none; border: none; color: white; font-size: 16px; outline: none; padding: 10px 0; }
        .search-wrapper input::placeholder { color: rgba(255,255,255,0.6); }
        
        .gemini-inline-btn {
            background: linear-gradient(135deg, #4285F4, #34A853); border: none; border-radius: 50%;
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none; transition: 0.3s; margin-left: 10px;
        }
        .gemini-inline-btn i { color: white !important; font-size: 18px; }

        /* 導覽選單 */
        .header-nav { display: flex; gap: 12px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .dropdown { position: relative; }
        
        .dropbtn {
            background-color: var(--bg-glass); color: white; padding: 12px 22px;
            font-size: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50px;
            cursor: pointer; backdrop-filter: blur(10px); display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .dropbtn:hover { border-color: var(--accent-blue); background-color: rgba(0, 210, 255, 0.2); }
        
        .dropdown-content {
            display: none; position: absolute; background: white; min-width: 240px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); border-radius: 15px; z-index: 100; margin-top: 10px;
            overflow: hidden; text-align: left;
        }
        .dropdown-content button, .dropdown-content a {
            background: none; border: none; width: 100%; box-sizing: border-box;
            color: #333; padding: 12px 18px; text-decoration: none; display: flex;
            align-items: center; gap: 10px; font-size: 14px; transition: 0.2s; cursor: pointer;
            text-align: left; font-family: inherit;
        }
        .dropdown-content button:hover, .dropdown-content a:hover { background: #f0f7ff; padding-left: 22px; }
        .show { display: block; animation: fadeIn 0.2s; }

        /* Mest 樣式 */
        .mest-icon-circle {
            background-color: white; color: #007bff; border: 1px solid #007bff;
            border-radius: 50%; width: 18px; height: 18px; display: inline-flex; 
            align-items: center; justify-content: center; font-size: 10px;
        }

        /* 課表區塊 */
        .content-card {
            background: var(--bg-glass); padding: 25px; border-radius: 20px;
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); margin: 0 auto 25px;
            max-width: 1100px;
        }
        h3 { margin-top: 0; display: flex; align-items: center; gap: 10px; color: var(--accent-blue); justify-content: center; }

        .schedule-table {
            width: 100%; border-collapse: collapse; margin-top: 15px;
            background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden;
        }
        .schedule-table th, .schedule-table td { padding: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .schedule-table th { background: rgba(0, 210, 255, 0.4); }
        .time-label { background: rgba(255,255,255,0.1); font-weight: bold; width: 50px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="clock-container">
        <div id="digital-clock">00:00:00</div>
        <div id="date-display">正在獲取日期...</div>
    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <i class="fas fa-search" style="color: var(--accent-blue); margin-right: 15px;"></i>
            <input type="text" id="smart-search" placeholder="輸入關鍵字搜尋，或直接輸入網址跳轉..." autocomplete="off" onkeydown="handleSearch(event)">
            <button type="button" onclick="smartRedirect('https://gemini.google.com/', 'googlechrome://gemini.google.com/')" class="gemini-inline-btn" title="啟動 Gemini">
                <i class="fas fa-wand-magic-sparkles"></i>
            </button>
        </div>
    </div>

    <div class="header-nav">
        <div class="dropdown">
            <button onclick="toggleDrop('schoolDrop')" class="dropbtn"><i class="fas fa-graduation-cap"></i> 學校與雲端工具</button>
            <div id="schoolDrop" class="dropdown-content">
                <a href="https://www.google.com" target="_blank">
                    <i class="fas fa-school" style="color: #ff6b6b;"></i> 學校首頁
                </a>
                
                <button onclick="smartRedirect('https://keep.google.com/', 'googlekeep://')">
                    <i class="fas fa-lightbulb" style="color: var(--keep-yellow);"></i> Google Keep 筆記/待辦
                </button>

                <button onclick="smartRedirect('https://mail.google.com/', 'googlegmail://')">
                    <i class="fas fa-envelope" style="color: #EA4335;"></i> Gmail 信箱
                </button>

                <a href="https://mest.meikoschool.com.tw/" target="_blank">
                    <span class="mest-icon-circle"><i class="fas fa-exclamation"></i></span> Mest 數位學習
                </a>

                <button onclick="smartRedirect('https://classroom.google.com/', 'googleclassroom://')">
                    <i class="fas fa-chalkboard" style="color: #1a73e8;"></i> Google Classroom
                </button>

                <button onclick="smartRedirect('https://docs.google.com/spreadsheets/d/13dxNULJ4kTqaSN46Z8IgAbG2l3utWMVDxhEjNFEHdJg/edit', 'googlesheets://docs.google.com/spreadsheets/d/13dxNULJ4kTqaSN46Z8IgAbG2l3utWMVDxhEjNFEHdJg/edit')">
                    <i class="fas fa-file-excel" style="color: #1D6F42;"></i> 數位聯絡簿
                </button>
            </div>
        </div>
    </div>

    <div class="content-card">
        <h3><i class="fas fa-table-list"></i> 主控台：班級課表</h3>
        <table class="schedule-table">
            <thead>
                <tr><th class="time-label">節</th><th>週一</th><th>週二</th><th>週三</th><th>週四</th><th>週五</th></tr>
            </thead>
            <tbody>                
                <tr><td class="time-label">1</td><td>童軍</td><td>公民</td><td>班輔</td><td>生科</td><td>體育</td></tr>
                <tr><td class="time-label">2</td><td>體育</td><td>本土</td><td>週會</td><td>資科</td><td>歷史</td></tr>
                <tr><td class="time-label">3</td><td>音樂</td><td>英會</td><td>表藝</td><td>生物</td><td>國文</td></tr>
                <tr><td class="time-label">4</td><td>國文</td><td>健教</td><td>國文</td><td>家政</td><td>英文</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // 【核心 1】智慧搜尋框邏輯 (自動判定網址與關鍵字)
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('smart-search').value.trim();
                if (!input) return;

                // 檢查是否為網址的規則 (帶有 .com, .tw, .net 或網址開頭等)
                const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;

                if (urlPattern.test(input)) {
                    let targetUrl = input;
                    if (!/^https?:\/\//i.test(input)) {
                        targetUrl = 'http://' + input; // 如果使用者沒打 http，自動補上
                    }
                    window.open(targetUrl, '_blank');
                } else {
                    // 如果不是網址，直接開啟 Google 搜尋
                    window.open('https://www.google.com/search?q=' + encodeURIComponent(input), '_blank');
                }
            }
        }

        // 【核心 2】跨平台智慧 App 轉址函數
        function smartRedirect(webUrl, iosUrl) {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIOS) {
                window.location.href = iosUrl; // iOS 開啟對應 App
            } else {
                window.open(webUrl, '_blank'); // 電腦版開啟網頁版
            }
        }

        // 時鐘與日期更新邏輯
        function updateTime() {
            const now = new Date();
            document.getElementById('digital-clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            document.getElementById('date-display').textContent = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }
        setInterval(updateTime, 1000); updateTime();

        // 下拉選單開關
        function toggleDrop(id) {
            document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
            document.getElementById(id).classList.toggle('show');
        }

        // 點擊空白處關閉選單
        window.onclick = function(event) {
            if (!event.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
            }
        }
    </script>
</body>
</html>
